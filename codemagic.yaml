# Codemagic builds the iPhone app on a cloud Mac and sends it to TestFlight.
# Uses the team's existing App Store Connect integration ("Codemagic") and the
# team's distribution certificate (tradeup_distribution). The App Store
# provisioning profile for com.lumoza.randombeat must exist in Codemagic's
# Code signing identities (fetched from Apple Developer).
workflows:
  ios-testflight:
    name: Randombeat iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lumoza.randombeat
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Uygulama sayfasını oluştur
        script: npm run app:native
      - name: İmza ayarları
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Derleme numarası
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Uygulamayı derle
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
